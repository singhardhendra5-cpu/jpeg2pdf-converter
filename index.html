<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JPEG2PDF Converter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root{
    --paper:#F1ECDC;
    --paper-line:#DCD3B4;
    --margin-red:#A83A32;
    --ink:#233047;
    --ink-soft:#5B6478;
    --stamp-green:#3C5B43;
    --card:#FBF8EE;
    --shadow: 0 1px 0 rgba(35,48,71,0.06);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      repeating-linear-gradient(
        var(--paper) 0px, var(--paper) 33px, var(--paper-line) 34px
      );
    background-color:var(--paper);
    font-family:'IBM Plex Mono', monospace;
    color:var(--ink);
    min-height:100vh;
    padding:0 0 60px 0;
  }
  .margin-rule{
    position:fixed;
    top:0; bottom:0;
    left:48px;
    width:2px;
    background:var(--margin-red);
    opacity:0.55;
    z-index:0;
  }
  @media (max-width:640px){ .margin-rule{ left:26px; } }

  .wrap{
    max-width:720px;
    margin:0 auto;
    padding:40px 28px 0 70px;
    position:relative;
    z-index:1;
  }
  @media (max-width:640px){ .wrap{ padding:28px 16px 0 44px; } }

  header{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:16px;
    margin-bottom:6px;
    flex-wrap:wrap;
  }
  h1{
    font-family:'Special Elite', monospace;
    font-size:28px;
    letter-spacing:0.5px;
    margin:0;
    line-height:1.15;
  }
  h1 span{ color:var(--margin-red); }
  .tagline{
    font-size:12.5px;
    color:var(--ink-soft);
    margin:6px 0 0;
    letter-spacing:0.3px;
  }
  .stamp{
    flex-shrink:0;
    border:2px solid var(--stamp-green);
    color:var(--stamp-green);
    border-radius:50%;
    width:78px; height:78px;
    display:flex; align-items:center; justify-content:center;
    text-align:center;
    font-size:9px;
    font-weight:700;
    letter-spacing:0.5px;
    text-transform:uppercase;
    line-height:1.35;
    transform:rotate(-8deg);
    padding:6px;
    opacity:0.9;
  }

  .divider{
    border:none;
    border-top:1px dashed var(--ink-soft);
    opacity:0.4;
    margin:22px 0;
  }

  .card{
    background:var(--card);
    border:1px solid var(--paper-line);
    box-shadow:var(--shadow);
  }

  .dropzone{
    position:relative;
    background:transparent;
    padding:6px 0 0;
    text-align:center;
    cursor:pointer;
  }
  .dz-btn{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:12px;
    width:100%;
    padding:20px 20px;
    background:linear-gradient(180deg, #4A7256 0%, var(--stamp-green) 100%);
    color:#FBF8EE;
    border-radius:14px;
    box-shadow:0 6px 0 #2A4030, 0 10px 20px -6px rgba(35,48,71,0.35);
    transition:transform 0.12s ease, box-shadow 0.12s ease, background 0.2s ease;
  }
  .dropzone:hover .dz-btn{
    background:linear-gradient(180deg, #547D63 0%, #446B4F 100%);
  }
  .dropzone:active .dz-btn,
  .dropzone.drag .dz-btn{
    transform:translateY(4px);
    box-shadow:0 2px 0 #2A4030, 0 4px 10px -4px rgba(35,48,71,0.35);
  }
  .dz-icon{
    width:34px; height:34px;
    flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
  }
  .dz-icon svg{ width:30px; height:30px; }
  .dz-cta{
    font-family:'Special Elite', monospace;
    font-size:19px;
    letter-spacing:0.4px;
  }
  .dropzone .dz-sub{
    display:block;
    font-size:11.5px;
    color:var(--ink-soft);
    margin-top:12px;
  }
  input[type=file]{ display:none; }

  .section-label{
    font-family:'Special Elite', monospace;
    font-size:13px;
    color:var(--ink-soft);
    text-transform:uppercase;
    letter-spacing:1px;
    margin:26px 0 10px;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .section-label::after{
    content:"";
    flex:1;
    border-top:1px dotted var(--ink-soft);
    opacity:0.4;
  }

  #empty-note{
    font-size:12.5px;
    color:var(--ink-soft);
    padding:14px 4px;
  }

  .row{
    display:flex;
    align-items:center;
    gap:10px;
    padding:10px 12px;
    border-bottom:1px solid var(--paper-line);
    background:var(--card);
  }
  .row:last-child{ border-bottom:1px solid var(--paper-line); }
  .row .no{
    font-weight:700;
    color:var(--margin-red);
    width:26px;
    text-align:right;
    flex-shrink:0;
    font-size:13px;
  }
  .row img{
    width:44px; height:44px;
    object-fit:cover;
    border:1px solid var(--paper-line);
    flex-shrink:0;
    background:#fff;
  }
  .row .fname{
    flex:1;
    min-width:0;
    font-size:12.5px;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .row .fsize{
    font-size:10.5px;
    color:var(--ink-soft);
    display:block;
  }
  .row .actions{
    display:flex;
    gap:4px;
    flex-shrink:0;
  }
  .icon-btn{
    border:1px solid var(--paper-line);
    background:#fff;
    color:var(--ink);
    width:28px; height:28px;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    font-size:13px;
    font-family:'IBM Plex Mono', monospace;
    line-height:1;
  }
  .icon-btn:hover{ background:var(--paper); }
  .icon-btn.danger{ color:var(--margin-red); }
  .icon-btn:disabled{ opacity:0.3; cursor:default; }

  .options{
    padding:16px;
  }
  .opt-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    padding:8px 0;
    font-size:12.5px;
    flex-wrap:wrap;
  }
  .opt-row label{ color:var(--ink-soft); }
  .opt-row .choices{ display:flex; gap:6px; }
  .chip{
    border:1px solid var(--ink-soft);
    background:transparent;
    color:var(--ink);
    padding:5px 10px;
    font-size:11.5px;
    cursor:pointer;
    font-family:'IBM Plex Mono', monospace;
  }
  .chip.active{
    background:var(--ink);
    color:var(--paper);
    border-color:var(--ink);
  }
  input[type=text]{
    font-family:'IBM Plex Mono', monospace;
    font-size:12.5px;
    border:1px solid var(--ink-soft);
    background:#fff;
    padding:7px 9px;
    width:100%;
    color:var(--ink);
  }

  .convert-btn{
    display:block;
    width:100%;
    margin-top:22px;
    padding:15px;
    font-family:'Special Elite', monospace;
    font-size:16px;
    letter-spacing:0.5px;
    background:var(--ink);
    color:var(--paper);
    border:none;
    cursor:pointer;
    text-transform:uppercase;
  }
  .convert-btn:disabled{
    background:#B9B4A0;
    cursor:default;
  }
  .convert-btn:not(:disabled):hover{ background:var(--margin-red); }

  .result{
    display:none;
    margin-top:18px;
    padding:16px;
    text-align:center;
    border:1px solid var(--stamp-green);
  }
  .result.show{ display:block; }
  .result .ok{
    font-family:'Special Elite', monospace;
    color:var(--stamp-green);
    font-size:14px;
    margin-bottom:12px;
  }
  .result-actions{
    display:flex;
    gap:10px;
    justify-content:center;
    flex-wrap:wrap;
  }
  .result-actions a, .result-actions button{
    font-family:'IBM Plex Mono', monospace;
    font-size:12.5px;
    padding:9px 16px;
    border:1px solid var(--ink);
    background:var(--ink);
    color:var(--paper);
    text-decoration:none;
    cursor:pointer;
  }
  .result-actions .secondary{
    background:transparent;
    color:var(--ink);
  }

  footer{
    text-align:center;
    font-size:10.5px;
    color:var(--ink-soft);
    margin-top:34px;
    padding-bottom:10px;
  }

  @media (prefers-reduced-motion: reduce){
    *{ transition:none !important; }
  }
  :focus-visible{
    outline:2px solid var(--margin-red);
    outline-offset:2px;
  }
</style>
</head>
<body>
<div class="margin-rule" aria-hidden="true"></div>
<div class="wrap">

  <header>
    <div>
      <h1>JPEG<span>2</span>PDF <span>·</span> Converter</h1>
      <p class="tagline">फोटो चुनें → क्रम लगाएँ → एक PDF बनाएँ</p>
    </div>
    <div class="stamp">100%<br>OFFLINE<br>NO UPLOAD</div>
  </header>

  <hr class="divider">

  <label class="dropzone" id="dropzone" for="fileInput" tabindex="0">
    <div class="dz-btn">
      <span class="dz-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 16v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"></path>
          <polyline points="7 9 12 4 17 9"></polyline>
          <line x1="12" y1="4" x2="12" y2="16"></line>
        </svg>
      </span>
      <span class="dz-cta">Images चुनें</span>
    </div>
    <span class="dz-sub">JPEG / PNG · एक साथ कई images चुन सकते हैं · यहाँ drag भी कर सकते हैं</span>
    <input type="file" id="fileInput" accept="image/jpeg,image/jpg,image/png" multiple>
  </label>

  <div class="section-label">प्रविष्टियाँ (Entries)</div>
  <div id="empty-note">अभी कोई image नहीं चुनी गई।</div>
  <div id="list" class="card"></div>

  <div class="section-label">विकल्प (Options)</div>
  <div class="card options">
    <div class="opt-row">
      <label>Page Size</label>
      <div class="choices" id="pageSizeChoices">
        <button class="chip active" data-val="a4">A4</button>
        <button class="chip" data-val="fit">Fit-to-Image</button>
      </div>
    </div>
    <div class="opt-row">
      <label>Orientation</label>
      <div class="choices" id="orientChoices">
        <button class="chip active" data-val="auto">Auto</button>
        <button class="chip" data-val="portrait">Portrait</button>
        <button class="chip" data-val="landscape">Landscape</button>
      </div>
    </div>
    <div class="opt-row" style="flex-direction:column; align-items:stretch;">
      <label style="margin-bottom:6px;">File Name</label>
      <input type="text" id="fileName" value="document">
    </div>
  </div>

  <button class="convert-btn" id="convertBtn" disabled>PDF में बदलें</button>

  <div class="result card" id="result">
    <div class="ok" id="resultText">✓ PDF तैयार है</div>
    <div class="result-actions">
      <a id="downloadLink" download="document.pdf">डाउनलोड करें</a>
      <button class="secondary" id="shareBtn">शेयर करें</button>
    </div>
  </div>

  <footer>सब कुछ आपके फ़ोन/ब्राउज़र में ही होता है — कोई फाइल कहीं upload नहीं होती।</footer>
</div>

<script>
(function(){
  const { jsPDF } = window.jspdf;

  let items = []; // {id, file, url}
  let counter = 0;
  let pageSize = 'a4';
  let orientation = 'auto';
  let generatedBlobUrl = null;
  let generatedBlob = null;

  const fileInput = document.getElementById('fileInput');
  const dropzone = document.getElementById('dropzone');
  const list = document.getElementById('list');
  const emptyNote = document.getElementById('empty-note');
  const convertBtn = document.getElementById('convertBtn');
  const result = document.getElementById('result');
  const resultText = document.getElementById('resultText');
  const downloadLink = document.getElementById('downloadLink');
  const shareBtn = document.getElementById('shareBtn');
  const fileNameInput = document.getElementById('fileName');

  function addFiles(fileList){
    const valid = Array.from(fileList).filter(f => /image\/(jpeg|jpg|png)/.test(f.type));
    valid.forEach(file => {
      const id = 'f' + (counter++);
      const url = URL.createObjectURL(file);
      items.push({ id, file, url });
    });
    render();
  }

  fileInput.addEventListener('change', (e) => {
    addFiles(e.target.files);
    fileInput.value = '';
  });

  dropzone.addEventListener('dragover', (e) => { e.preventDefault(); dropzone.classList.add('drag'); });
  dropzone.addEventListener('dragleave', () => dropzone.classList.remove('drag'));
  dropzone.addEventListener('drop', (e) => {
    e.preventDefault();
    dropzone.classList.remove('drag');
    if (e.dataTransfer.files.length) addFiles(e.dataTransfer.files);
  });
  dropzone.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); fileInput.click(); }
  });

  function fmtSize(bytes){
    if (bytes < 1024) return bytes + ' B';
    if (bytes < 1024*1024) return (bytes/1024).toFixed(1) + ' KB';
    return (bytes/(1024*1024)).toFixed(2) + ' MB';
  }

  function render(){
    list.innerHTML = '';
    emptyNote.style.display = items.length ? 'none' : 'block';
    items.forEach((item, idx) => {
      const row = document.createElement('div');
      row.className = 'row';
      row.innerHTML = `
        <span class="no">${String(idx+1).padStart(2,'0')}</span>
        <img src="${item.url}" alt="">
        <span class="fname">${item.file.name}<span class="fsize">${fmtSize(item.file.size)}</span></span>
        <span class="actions">
          <button class="icon-btn" data-act="up" data-id="${item.id}" ${idx===0?'disabled':''} aria-label="ऊपर ले जाएँ">↑</button>
          <button class="icon-btn" data-act="down" data-id="${item.id}" ${idx===items.length-1?'disabled':''} aria-label="नीचे ले जाएँ">↓</button>
          <button class="icon-btn danger" data-act="remove" data-id="${item.id}" aria-label="हटाएँ">✕</button>
        </span>
      `;
      list.appendChild(row);
    });
    convertBtn.disabled = items.length === 0;
    hideResult();
  }

  list.addEventListener('click', (e) => {
    const btn = e.target.closest('.icon-btn');
    if (!btn) return;
    const id = btn.dataset.id;
    const act = btn.dataset.act;
    const idx = items.findIndex(i => i.id === id);
    if (idx === -1) return;
    if (act === 'remove') {
      URL.revokeObjectURL(items[idx].url);
      items.splice(idx, 1);
    } else if (act === 'up' && idx > 0) {
      [items[idx-1], items[idx]] = [items[idx], items[idx-1]];
    } else if (act === 'down' && idx < items.length - 1) {
      [items[idx+1], items[idx]] = [items[idx], items[idx+1]];
    }
    render();
  });

  document.getElementById('pageSizeChoices').addEventListener('click', (e) => {
    const chip = e.target.closest('.chip');
    if (!chip) return;
    document.querySelectorAll('#pageSizeChoices .chip').forEach(c => c.classList.remove('active'));
    chip.classList.add('active');
    pageSize = chip.dataset.val;
    hideResult();
  });
  document.getElementById('orientChoices').addEventListener('click', (e) => {
    const chip = e.target.closest('.chip');
    if (!chip) return;
    document.querySelectorAll('#orientChoices .chip').forEach(c => c.classList.remove('active'));
    chip.classList.add('active');
    orientation = chip.dataset.val;
    hideResult();
  });

  function hideResult(){
    result.classList.remove('show');
    if (generatedBlobUrl) { URL.revokeObjectURL(generatedBlobUrl); generatedBlobUrl = null; }
  }

  function loadImage(url){
    return new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = () => resolve(img);
      img.onerror = reject;
      img.src = url;
    });
  }

  convertBtn.addEventListener('click', async () => {
    if (items.length === 0) return;
    convertBtn.disabled = true;
    convertBtn.textContent = 'बन रहा है...';

    try {
      const A4 = { w: 210, h: 297 };
      let doc = null;

      for (let i = 0; i < items.length; i++) {
        const img = await loadImage(items[i].url);
        const imgRatio = img.width / img.height;

        let pageW, pageH;
        if (pageSize === 'fit') {
          const mm = pxToMm(img.width, img.height);
          pageW = mm.w; pageH = mm.h;
        } else {
          pageW = A4.w; pageH = A4.h;
        }

        let isLandscape;
        if (orientation === 'portrait') isLandscape = false;
        else if (orientation === 'landscape') isLandscape = true;
        else isLandscape = imgRatio > 1;

        if (pageSize === 'a4' && isLandscape) { [pageW, pageH] = [pageH, pageW]; }
        else if (pageSize === 'fit' && isLandscape && pageW < pageH) { [pageW, pageH] = [pageH, pageW]; }

        if (!doc) {
          doc = new jsPDF({ orientation: isLandscape ? 'landscape' : 'portrait', unit: 'mm', format: pageSize === 'fit' ? [pageW, pageH] : 'a4' });
        } else {
          doc.addPage(pageSize === 'fit' ? [pageW, pageH] : 'a4', isLandscape ? 'landscape' : 'portrait');
        }

        let drawW, drawH;
        if (pageSize === 'fit') {
          drawW = pageW; drawH = pageH;
        } else {
          const margin = 8;
          const availW = pageW - margin*2;
          const availH = pageH - margin*2;
          const scale = Math.min(availW / (imgRatio >= 1 ? availW : availH*imgRatio), 1);
          const fitRatio = Math.min(availW/img.width, availH/img.height) * 3.78; // px->mm approx via ratio math below instead
          drawW = availW;
          drawH = availW / imgRatio;
          if (drawH > availH) { drawH = availH; drawW = availH * imgRatio; }
        }
        const x = (pageW - drawW) / 2;
        const y = (pageH - drawH) / 2;

        const format = items[i].file.type.includes('png') ? 'PNG' : 'JPEG';
        doc.addImage(img, format, x, y, drawW, drawH, undefined, 'FAST');
      }

      const blob = doc.output('blob');
      generatedBlob = blob;
      generatedBlobUrl = URL.createObjectURL(blob);

      const name = (fileNameInput.value.trim() || 'document').replace(/[^a-zA-Z0-9-_]/g, '_') + '.pdf';
      downloadLink.href = generatedBlobUrl;
      downloadLink.download = name;
      resultText.textContent = `✓ PDF तैयार है — ${items.length} पेज`;
      result.classList.add('show');
    } catch (err) {
      alert('PDF बनाने में समस्या हुई: ' + err.message);
    } finally {
      convertBtn.disabled = false;
      convertBtn.textContent = 'PDF में बदलें';
    }
  });

  function pxToMm(px_w, px_h){
    const dpi = 96;
    return { w: px_w * 25.4 / dpi, h: px_h * 25.4 / dpi };
  }

  shareBtn.addEventListener('click', async () => {
    if (!generatedBlob) return;
    const name = (fileNameInput.value.trim() || 'document').replace(/[^a-zA-Z0-9-_]/g, '_') + '.pdf';
    const fileObj = new File([generatedBlob], name, { type: 'application/pdf' });
    if (navigator.share && navigator.canShare && navigator.canShare({ files: [fileObj] })) {
      try { await navigator.share({ files: [fileObj], title: name }); }
      catch(e) { /* user cancelled */ }
    } else {
      downloadLink.click();
    }
  });
})();
</script>
</body>
</html>
